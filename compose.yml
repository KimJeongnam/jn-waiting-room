services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bulk_ticket
      POSTGRES_USER: bulk_ticket
      POSTGRES_PASSWORD: bulk_ticket_dev
    ports:
      # 기존 로컬 PostgreSQL의 5432 포트와 충돌하지 않도록 5433을 사용합니다.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulk_ticket -d bulk_ticket"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
